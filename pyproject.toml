[build-system]
# Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-toolkit"
# Not a published version. The registry version lives in
# `.tessl-plugin/plugin.json` and is bumped by the publish workflow
# (`tesslio/patch-version-publish`). This package is never uploaded to PyPI —
# `pyproject.toml` exists to declare dependencies and pytest config for a local
# or CI checkout. A real number here would be a second versioning scheme with
# nothing keeping it in step with the one that ships.
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "python-pptx==1.0.2",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "psutil==7.2.2",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "pypdf==6.15.0",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "lxml==6.1.1",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "qrcode==8.2",
    # Video/image dependency pins renew through the same weekly Dependabot lane.
    "Pillow==12.3.0",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "pytesseract==0.3.13",
    "ImageHash==4.3.2",
    # 2.2.6 is the newest NumPy line compatible with requires-python >=3.10.
    "numpy==2.2.6",
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "filelock==3.32.2",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    # Pinned deliberately, not by habit: 1.0 removed the `get_transcript`
    # classmethod, and that uncontrolled API change is what put four Python
    # tracebacks into the vault's transcripts. Pin + Dependabot pip ecosystem
    # in .github/dependabot.yml (weekly), so the next break lands as a reviewed
    # bump rather than as corrupt data.
    "youtube-transcript-api==1.2.4",
]

[project.optional-dependencies]
test = [
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "pytest==9.1.1",
    # tests/test_pyproject_pins.py parses this manifest's own requirements as
    # PEP 508 rather than pattern-matching their text.
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "packaging==26.3",
    # `tomllib` entered the stdlib in 3.11; requires-python still admits 3.10.
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "tomli==2.4.1; python_version < '3.11'",
]
# Lint and formatting, run by the #162 CI gate. Its own group because the test
# runner does not need it and a lint bump should not rebuild a test image.
# A formatter/linter bump is its own change, per
# `rules/code-formatting.md` Separation of Concerns.
lint = [
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "ruff==0.16.2",
    # The pip distribution bundles its own Node runtime, so CI needs no
    # separate Node setup step.
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "pyright==1.1.411",
    # lxml ships no inline types and Pyright's bundled typeshed has no `etree`
    # symbol for it; without these stubs the import reads as unresolved.
    # Pin + Dependabot pip ecosystem in .github/dependabot.yml (weekly).
    "lxml-stubs==0.5.1",
]
# Local Whisper transcription, used by vault-ingress/scripts/fetch-transcript.py
# when a video has no caption track. Optional and not in the base dependency set
# because mlx-whisper requires Apple Silicon and cannot install on the Linux CI
# runners — see `rules/testing-standards.md` Platform-Bound Untestable Carve-Out.
# The script imports it lazily and degrades with an actionable message, so the
# caption path works everywhere without it.
whisper = [
    "mlx-whisper==0.4.3",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
# The repo's prevailing width. Kept explicit rather than inherited so a Ruff
# default change cannot silently rewrap the tree.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Ruff's default set (`E4`, `E7`, `E9`, `F`) plus BLE. `error-handling` forbids
# bare catch-alls outside an outer process boundary, and BLE001 is the only rule
# that sees them; the boundaries that legitimately need one carry an inline
# `# noqa: BLE001` naming its cause, per that rule's Outer-Boundary carve-out.
#
# E501 (line-too-long) stays off deliberately: the formatter owns line width,
# and running both makes the linter argue with the formatter over lines the
# formatter cannot split (long URLs, literal error strings).
select = ["E4", "E7", "E9", "F", "BLE"]

[tool.pyright]
# `language-diagnostics` Resolve Modules First: imports must resolve before
# strictness is worth raising, or real null-flow bugs hide behind resolution
# false-positives. Every script directory is its own sys.path root at runtime
# (each script is executed directly, so its own directory leads sys.path), and
# conftest.py inserts each of them for the tests.
#
# Pyright resolves third-party imports against the ACTIVE interpreter, so it
# must run in the same environment the tests do — `pip install '.[test,lint]'`
# then `pyright`. Run against a bare system Python and 94 resolution
# false-positives reappear, hiding the real findings underneath.
pythonVersion = "3.10"
include = ["scripts", "skills", "tests"]
exclude = ["**/__pycache__", ".venv", ".tessl"]
executionEnvironments = [
    # illustrations reads the outline schema from presentation-creator.
    { root = "skills/illustrations/scripts", extraPaths = [
        "skills/illustrations/scripts",
        "skills/presentation-creator/scripts",
    ] },
    { root = "skills/presentation-creator/scripts", extraPaths = ["skills/presentation-creator/scripts"] },
    # clarification and profile splice the vault-ingress scripts onto sys.path
    # at import time to share its validators.
    { root = "skills/vault-clarification/scripts", extraPaths = [
        "skills/vault-clarification/scripts",
        "skills/vault-ingress/scripts",
    ] },
    { root = "skills/vault-ingress/scripts", extraPaths = ["skills/vault-ingress/scripts"] },
    { root = "skills/vault-profile/scripts", extraPaths = [
        "skills/vault-profile/scripts",
        "skills/vault-ingress/scripts",
    ] },
    # Repo-root gate scripts, imported by their tests the same way.
    { root = "scripts", extraPaths = ["scripts"] },
    { root = "tests", extraPaths = [
        "tests",
        "scripts",
        "skills/illustrations/scripts",
        "skills/presentation-creator/scripts",
        "skills/vault-clarification/scripts",
        "skills/vault-ingress/scripts",
        "skills/vault-profile/scripts",
    ] },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
