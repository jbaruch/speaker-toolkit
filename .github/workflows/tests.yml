name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs. tests.yml has no fast path: the apt install of
# libreoffice is minutes-long and, on flaky runner networking, can wedge for
# hours. Without this, every new push to a PR left the prior run's install
# zombying toward the 6h job limit (observed: 3 stuck runs at once).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop against the apt step hanging on flaky runner networking: fail
    # fast and re-runnable instead of consuming the 6h default job limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce tessl-version-floating carve-out
        # See rules/tessl-version-floating.md. Fails the build if any
        # dependency in a covered manifest uses a specifier other than
        # the permitted floating value "latest" — the deploy-time check
        # preconditioned by `coding-policy: dependency-management`'s
        # runtime-managed-manifest carve-out.
        run: ./scripts/check-tessl-pins.sh
      - name: Verify the published package ships every declared file
        # Fails the build when a .tesslignore pattern would strip content the
        # manifest declares. .tesslignore is gitignore semantics, so an
        # unanchored "scripts/" silently stripped all 59 skills/*/scripts/
        # files from 0.18.43 through 0.18.61 while publish reported success.
        run: ./scripts/check-package-contents.sh
      - name: Cache apt package downloads
        # Cache the downloaded .deb archives (kept in a runner-writable dir via
        # Dir::Cache::Archives below), so the slow libreoffice fetch only hits
        # the network on a cache miss. Bump the key suffix to invalidate.
        uses: actions/cache@v4
        with:
          path: /tmp/apt-cache
          key: apt-${{ runner.os }}-ffmpeg-libreoffice-tesseract-v1
      - name: Install system dependencies (ffmpeg, libreoffice-impress, tesseract)
        # ffmpeg drives the video-slide-extraction tests; libreoffice-impress
        # drives the PPTX->PDF export tests; tesseract drives OCR of baked-in
        # picture text in pptx-extraction. Video/PDF groups skipif their binary
        # is absent; OCR unit tests inject a fake engine, integration tests
        # skipif tesseract is missing — install hiccup degrades coverage
        # rather than red-failing the suite.
        #
        # Why this is verbose instead of a plain `apt-get install`: the plain
        # form intermittently wedged for the full 6h job limit (the identical
        # install completes in ~2-3 min in a clean Ubuntu container locally, so
        # it is a flaky-mirror infra issue, not a debconf prompt). The fixes:
        #   - Acquire::*::Timeout + Acquire::Retries bound each mirror
        #     connection (apt has effectively no default cap → the actual hang).
        #   - `timeout` per command turns a stall into a fast, visible failure.
        #   - Timestamped, line-by-line output (`set -x` + the stamp filter)
        #     shows exactly which package/URL it is on if it stalls again.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo mkdir -p /tmp/apt-cache/partial
          sudo chmod -R 777 /tmp/apt-cache
          sudo tee /etc/apt/apt.conf.d/99ci >/dev/null <<'CONF'
          Dir::Cache::Archives "/tmp/apt-cache";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          CONF
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          timeout 300 sudo -E apt-get update 2>&1 | stamp
          # tesseract-ocr pin: Ubuntu noble package version. No Dependabot
          # ecosystem for apt — renew quarterly, or when noble's package
          # advances (bump version + apt cache key suffix above).
          timeout 600 sudo -E apt-get install -y ffmpeg libreoffice-impress \
            tesseract-ocr=5.3.4-1build5 2>&1 | stamp
      - run: pip install ".[test]"
      - run: pytest -v --tb=short

  # Exercise Windows Job containment and POSIX trusted-worker process-group
  # cleanup plus sampled descendant monitoring, including a non-injected psutil
  # monitor smoke test, on native hosts; Ubuntu already runs the full suite.
  supervisor-platform:
    name: Artifact supervisor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[test]"
      - run: >-
          pytest -v --tb=short
          tests/test_artifact_supervisor.py
          tests/test_pattern_evidence.py::test_forward_slash_root_uses_native_absolute_path_semantics
          tests/test_check_runtime.py::test_psutil_version_authorities_are_synchronized
