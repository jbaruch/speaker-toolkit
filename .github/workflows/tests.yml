name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs. tests.yml has no fast path: the apt install of
# libreoffice is minutes-long and, on flaky runner networking, can wedge for
# hours. Without this, every new push to a PR left the prior run's install
# zombying toward the 6h job limit (observed: 3 stuck runs at once).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `coding-policy: code-formatting` CI Integration — format/lint checks run
  # BEFORE tests, in their own fast job. `test` carries a multi-minute apt
  # install for ffmpeg/libreoffice/tesseract; gating on `lint` means a style or
  # type regression reports in about a minute and never pays for that install.
  lint:
    name: Lint, format, and type gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pyright resolves third-party imports against the ACTIVE interpreter, so
      # the runtime dependencies must be present even though nothing here runs
      # them. Without them it reports ~94 resolution false-positives and stops
      # deep-checking the code underneath (`[tool.pyright]` in pyproject.toml).
      - run: pip install ".[test,lint]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pyright
        run: pyright
      # No token: lint needs no auth, so the gate also runs on fork pull
      # requests, where secrets are unavailable.
      - uses: tesslio/setup-tessl@v2
        with:
          # Tessl CLI pin. No Dependabot ecosystem tracks the CLI version an
          # action input names; renew quarterly, or when the publish workflow's
          # own lint disagrees with this gate. Keep both jobs on one version.
          version: "0.95.0"
      - name: Verify no conflict marker was committed
        # Fails the build on any of the four merge markers in a tracked text
        # file. A diff3 base marker (|||||||) survived a resolution and shipped
        # in CHANGELOG.md: ruff does not read Markdown, and `git diff --check`
        # only inspects the working diff, so an already-committed marker passed.
        run: python3 scripts/check_conflict_markers.py > /dev/null
      - name: Validate plugin structure
        # context-artifacts -> Plugin Structure requires a clean lint before
        # every publish. The publish workflow runs it after merge, which turns
        # a frontmatter error into an aborted release instead of a failed PR.
        # Advisory policy lives in the script, not here.
        run: python3 scripts/check_plugin_lint.py > /dev/null

  test:
    needs: lint
    runs-on: ubuntu-latest
    # Backstop against the apt step hanging on flaky runner networking: fail
    # fast and re-runnable instead of consuming the 6h default job limit.
    # Raised from 25 when the markdown deck renderers landed: a cold cache pays
    # for three npm trees and two browser downloads on top of the apt install,
    # and four live renders after that. A warm cache is nowhere near this.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # tests/test_plugin_lint_gate.py drives the real CLI against synthetic
      # plugins. `ci-safety` -> Install, Don't Skip: install the tool rather
      # than skipping the cases that need it.
      - uses: tesslio/setup-tessl@v2
        with:
          # Tessl CLI pin. No Dependabot ecosystem tracks the CLI version an
          # action input names; renew quarterly, or when the publish workflow's
          # own lint disagrees with this gate. Keep both jobs on one version.
          version: "0.95.0"
      - name: Enforce tessl-version-floating carve-out
        # See rules/tessl-version-floating.md. Fails the build if any
        # dependency in a covered manifest uses a specifier other than
        # the permitted floating value "latest" — the deploy-time check
        # preconditioned by `coding-policy: dependency-management`'s
        # runtime-managed-manifest carve-out.
        # JSON verdict on stdout, diagnostics on stderr; the step reads the
        # exit code, so the report is discarded.
        run: python3 scripts/check_tessl_pins.py > /dev/null
      - name: Verify the published package ships every declared file
        # Fails the build when a .tesslignore pattern would strip content the
        # manifest declares. .tesslignore is gitignore semantics, so an
        # unanchored "scripts/" silently stripped all 59 skills/*/scripts/
        # files from 0.18.43 through 0.18.61 while publish reported success.
        run: python3 scripts/check_package_contents.py > /dev/null
      - name: Verify every shipped file survives the install extension filter
        # Fails the build when a file the manifest ships carries an extension
        # `tessl install` drops (anything outside .md/.py/.sh/.txt/.json) and
        # has no byte-identical .txt mirror. The drop is silent at pack,
        # publish and install, so _dimensions.yaml was absent from every clean
        # install from 0.20.57 on and the catalog audit exited 1 (issue #316).
        run: python3 scripts/check_shipped_extensions.py > /dev/null
      - name: Resolve the apt cache key
        id: apt-cache-key
        # The key binds to the pinned package set, not to the installer file: a
        # renewed pin must invalidate the cache, and an edited comment or a
        # reordered fallback must not throw away 185 MiB of archives. The week
        # stamp is the renewal cadence — a set nobody touches is still refetched
        # rather than pinned forever (`dependency-management` Freshness).
        #
        # The suite name is in the key too. `ubuntu-latest` moves to the next
        # LTS on GitHub's schedule, and an entry saved under the previous one
        # holds indices and archives the new suite's apt cannot install from —
        # and `actions/cache` does not save on an exact key hit, so the new
        # suite would go without an entry of its own until the week rolled.
        run: |
          set -euo pipefail
          packages="$(python3 scripts/install_system_deps.py --package-digest)"
          codename="$(python3 scripts/install_system_deps.py --codename)"
          week="$(date -u +%G-%V)"
          {
            echo "packages=$packages"
            echo "codename=$codename"
            echo "week=$week"
          } >> "$GITHUB_OUTPUT"
      - name: Cache apt package downloads and package indices
        # Both halves, and the second is the point. Caching only the .deb
        # archives left `apt-get update` fetching the indices from a mirror on
        # every run, so a cache that restored 185 MiB still paid a full network
        # round-trip — and that fetch, not the download, is what stalled the job
        # for 20 minutes. With the indices here too, a hit installs offline.
        uses: actions/cache@v4
        with:
          path: |
            /tmp/apt-cache
            /tmp/apt-lists
          key: apt-${{ runner.os }}-${{ steps.apt-cache-key.outputs.codename }}-${{ steps.apt-cache-key.outputs.packages }}-${{ steps.apt-cache-key.outputs.week }}
      - name: Install system dependencies (ffmpeg, libreoffice-impress, tesseract)
        # Offline from the cache when it can, else through the mirror list with a
        # reachability probe ahead of each host. The package set, mirror list,
        # timeouts and fallback order are the script's — see
        # scripts/install_system_deps.py (module docstring and top-of-file
        # constants), covered by tests/test_install_system_deps.py.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: python3 scripts/install_system_deps.py "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          # reveal-md 6.1.4 declares `node: ^18.18.0 || ^20.9.0 || ^22.0.0`, and
          # scripts/install_deck_renderers.py pins the major it expects so a
          # drift between the two fails a test rather than a CI run. No
          # Dependabot ecosystem tracks a `node-version` input; renew this
          # literal with the renderer pins in that script.
          node-version: "22.23.2"
      - name: Resolve the markdown-deck renderer cache key
        id: deck-renderers
        # Keyed on the pin set, not the installer file: a renewed pin must miss
        # the cache and reinstall, an edited comment must not throw away three
        # npm trees and a browser download.
        run: |
          set -euo pipefail
          digest="$(python3 scripts/install_deck_renderers.py --pin-digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Cache the markdown deck renderers
        # Three paths, because the browsers do not live in the workspace and
        # they are the expensive half of this install. Two of them: Slidev
        # drives playwright's chromium, reveal-md drives puppeteer's chrome,
        # and each postinstall downloads into its own cache root. Caching the
        # npm tree without them would restore a tree whose postinstalls never
        # run again and leave reveal-md with no browser at all.
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/deck-renderers
            ~/.cache/ms-playwright
            ~/.cache/puppeteer
          key: deck-renderers-${{ runner.os }}-${{ steps.deck-renderers.outputs.digest }}
      - name: Install the markdown deck renderers
        # presenterm, Slidev, Marp and reveal-md, so the renderer's tests drive
        # the real tools rather than stand-ins (`ci-safety` Install, Don't
        # Skip). Pins, checksums, and the idempotent cache-hit path are the
        # script's — see scripts/install_deck_renderers.py, covered by
        # tests/test_install_deck_renderers.py. The report is discarded; the
        # step reads the exit code and the PATH export.
        run: python3 scripts/install_deck_renderers.py "$GITHUB_WORKSPACE" > /dev/null
      # `markdown-deck` carries weasyprint, which presenterm shells out to for
      # its PDF export. Declared as an extra so the pip ecosystem in
      # .github/dependabot.yml renews it like every other pin.
      - run: pip install ".[test,markdown-deck]"
      - run: pytest -v --tb=short

  # Exercise native artifact supervision, path handling, private video
  # workspaces, and atomic PDF publication; Ubuntu already runs the full suite.
  supervisor-platform:
    needs: lint
    name: Artifact platform contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install macOS media evidence dependencies
        if: runner.os == 'macOS'
        shell: bash
        # Immutable FFmpeg 8.1.2 Intel archives. Renew the URLs and checksums
        # quarterly, or when the approved media-tool version advances.
        env:
          FFMPEG_URL: https://evermeet.cx/ffmpeg/ffmpeg-8.1.2.zip
          FFMPEG_SHA256: e91df72a1ee7c26606f90dd2dd4dcccc6a75140ff9ea6fdd50faae828b82ba69
          FFPROBE_URL: https://evermeet.cx/ffmpeg/ffprobe-8.1.2.zip
          FFPROBE_SHA256: 399b93f0b9862f69767afa343e90c2f48d7e7958cadbb6deb76a012d0e3b7ce3
        run: |
          set -euo pipefail
          media_dir="$RUNNER_TEMP/speaker-toolkit-ffmpeg-8.1.2"
          mkdir -p "$media_dir/bin"
          curl -fL --retry 3 --output "$media_dir/ffmpeg.zip" "$FFMPEG_URL"
          curl -fL --retry 3 --output "$media_dir/ffprobe.zip" "$FFPROBE_URL"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$media_dir/ffmpeg.zip" \
            | shasum -a 256 -c -
          printf '%s  %s\n' "$FFPROBE_SHA256" "$media_dir/ffprobe.zip" \
            | shasum -a 256 -c -
          unzip -q "$media_dir/ffmpeg.zip" -d "$media_dir/bin"
          unzip -q "$media_dir/ffprobe.zip" -d "$media_dir/bin"
          chmod +x "$media_dir/bin/ffmpeg" "$media_dir/bin/ffprobe"
          printf '%s\n' "$media_dir/bin" >> "$GITHUB_PATH"
      - name: Install Windows media evidence dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey package pin, renewed 8.1.2 -> 9.0.0 -> 9.0.1, each time
        # after the feed withdrew the previous one and took `main` red with no
        # source change. No
        # Dependabot ecosystem covers Chocolatey, so RENEWAL IS MANUAL: check
        # the feed's current version whenever this step fails to resolve, or
        # quarterly, whichever comes first. Chocolatey serves only the current
        # version of a package, so expect this pin to need renewing again.
        #
        # The macOS lane pins separately: evermeet.cx serves immutable archives
        # and each is checksum-verified above, so that pin does not rot.
        #
        # Put the real binaries ahead of Chocolatey's process-spawning shims:
        # the supervised worker intentionally permits only itself plus one
        # ffprobe child.
        run: |
          $ErrorActionPreference = 'Stop'
          choco install ffmpeg --version=9.0.1 --no-progress -y
          # Locate the real binary rather than assuming a layout. The package
          # moved ffprobe.exe out of tools\ffmpeg\bin between versions, so a
          # hardcoded path fails on exactly the upgrade that unpinning invites.
          # Searching the package tree is what makes tracking-current safe.
          # No -ErrorAction override: a traversal failure is a different fault
          # from an absent binary, and swallowing it would report the wrong one.
          try {
            $probe = Get-ChildItem -Path 'C:\ProgramData\chocolatey\lib\ffmpeg' `
              -Filter 'ffprobe.exe' -Recurse -File |
              Select-Object -First 1
          } catch [System.IO.DirectoryNotFoundException] {
            throw "the Chocolatey ffmpeg package directory does not exist — the install reported success but laid nothing down; check the pinned version still resolves"
          } catch [System.UnauthorizedAccessException] {
            throw "cannot read the Chocolatey ffmpeg package tree: access denied — the runner lacks permission on C:\ProgramData\chocolatey\lib\ffmpeg"
          } catch [System.IO.IOException] {
            throw "cannot read the Chocolatey ffmpeg package tree: $($_.Exception.Message)"
          }
          if (-not $probe) {
            throw "Chocolatey installed ffmpeg 9.0.1 but no ffprobe.exe is in its package tree — check the package layout and update this step's search root"
          }
          $ffmpegBin = $probe.DirectoryName
          if (-not (Test-Path (Join-Path $ffmpegBin 'ffmpeg.exe') -PathType Leaf)) {
            throw "ffprobe.exe found at $ffmpegBin but ffmpeg.exe is not beside it — the package split the binaries; put both on PATH explicitly"
          }
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pip install ".[test]"
      - run: >-
          pytest -v --tb=short
          tests/test_artifact_locator.py
          tests/test_vault_root_authority.py
          tests/test_artifact_supervisor.py
          tests/test_artifact_metadata.py
          tests/test_pdf_evidence.py
          tests/test_video_evidence.py
          tests/test_video_slide_extraction.py
          tests/test_pattern_evidence.py::test_forward_slash_root_is_classified_without_host_reinterpretation
          tests/test_check_runtime.py::test_psutil_version_authorities_are_synchronized
