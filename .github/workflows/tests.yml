name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs. tests.yml has no fast path: the apt install of
# libreoffice is minutes-long and, on flaky runner networking, can wedge for
# hours. Without this, every new push to a PR left the prior run's install
# zombying toward the 6h job limit (observed: 3 stuck runs at once).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Backstop against the apt step hanging on flaky runner networking: fail
    # fast and re-runnable instead of consuming the 6h default job limit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enforce tessl-version-floating carve-out
        # See rules/tessl-version-floating.md. Fails the build if any
        # dependency in a covered manifest uses a specifier other than
        # the permitted floating value "latest" — the deploy-time check
        # preconditioned by `coding-policy: dependency-management`'s
        # runtime-managed-manifest carve-out.
        run: ./scripts/check-tessl-pins.sh
      - name: Verify the published package ships every declared file
        # Fails the build when a .tesslignore pattern would strip content the
        # manifest declares. .tesslignore is gitignore semantics, so an
        # unanchored "scripts/" silently stripped all 59 skills/*/scripts/
        # files from 0.18.43 through 0.18.61 while publish reported success.
        run: ./scripts/check-package-contents.sh
      - name: Cache apt package downloads
        # Cache the downloaded .deb archives (kept in a runner-writable dir via
        # Dir::Cache::Archives below), so the slow libreoffice fetch only hits
        # the network on a cache miss. Bump the key suffix to invalidate.
        uses: actions/cache@v4
        with:
          path: /tmp/apt-cache
          key: apt-${{ runner.os }}-ffmpeg-libreoffice-tesseract-v1
      - name: Install system dependencies (ffmpeg, libreoffice-impress, tesseract)
        # ffmpeg drives the video-slide-extraction tests; libreoffice-impress
        # drives the PPTX->PDF export tests; tesseract drives OCR of baked-in
        # picture text in pptx-extraction. Source-video evidence tests require
        # ffmpeg/ffprobe and fail if either is absent. OCR unit tests inject a
        # fake engine; integration tests skipif tesseract is missing.
        #
        # Why this is verbose instead of a plain `apt-get install`: the plain
        # form intermittently wedged for the full 6h job limit (the identical
        # install completes in ~2-3 min in a clean Ubuntu container locally, so
        # it is a flaky-mirror infra issue, not a debconf prompt). The fixes:
        #   - Acquire::*::Timeout + Acquire::Retries bound each mirror
        #     connection (apt has effectively no default cap → the actual hang).
        #   - `timeout` per command turns a stall into a fast, visible failure.
        #   - Timestamped, line-by-line output (`set -x` + the stamp filter)
        #     shows exactly which package/URL it is on if it stalls again.
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo mkdir -p /tmp/apt-cache/partial
          sudo chmod -R 777 /tmp/apt-cache
          sudo tee /etc/apt/apt.conf.d/99ci >/dev/null <<'CONF'
          Dir::Cache::Archives "/tmp/apt-cache";
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          CONF
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date -u +%H:%M:%S)" "$line"; done; }
          timeout 300 sudo -E apt-get update 2>&1 | stamp
          # tesseract-ocr pin: Ubuntu noble package version. No Dependabot
          # ecosystem for apt — renew quarterly, or when noble's package
          # advances (bump version + apt cache key suffix above).
          timeout 600 sudo -E apt-get install -y ffmpeg libreoffice-impress \
            tesseract-ocr=5.3.4-1build5 2>&1 | stamp
      - run: pip install ".[test]"
      - run: pytest -v --tb=short

  # Exercise native artifact supervision, path handling, private video
  # workspaces, and atomic PDF publication; Ubuntu already runs the full suite.
  supervisor-platform:
    name: Artifact platform contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install macOS media evidence dependencies
        if: runner.os == 'macOS'
        shell: bash
        # Immutable FFmpeg 8.1.2 Intel archives. Renew the URLs and checksums
        # quarterly, or when the approved media-tool version advances.
        env:
          FFMPEG_URL: https://evermeet.cx/ffmpeg/ffmpeg-8.1.2.zip
          FFMPEG_SHA256: e91df72a1ee7c26606f90dd2dd4dcccc6a75140ff9ea6fdd50faae828b82ba69
          FFPROBE_URL: https://evermeet.cx/ffmpeg/ffprobe-8.1.2.zip
          FFPROBE_SHA256: 399b93f0b9862f69767afa343e90c2f48d7e7958cadbb6deb76a012d0e3b7ce3
        run: |
          set -euo pipefail
          media_dir="$RUNNER_TEMP/speaker-toolkit-ffmpeg-8.1.2"
          mkdir -p "$media_dir/bin"
          curl -fL --retry 3 --output "$media_dir/ffmpeg.zip" "$FFMPEG_URL"
          curl -fL --retry 3 --output "$media_dir/ffprobe.zip" "$FFPROBE_URL"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$media_dir/ffmpeg.zip" \
            | shasum -a 256 -c -
          printf '%s  %s\n' "$FFPROBE_SHA256" "$media_dir/ffprobe.zip" \
            | shasum -a 256 -c -
          unzip -q "$media_dir/ffmpeg.zip" -d "$media_dir/bin"
          unzip -q "$media_dir/ffprobe.zip" -d "$media_dir/bin"
          chmod +x "$media_dir/bin/ffmpeg" "$media_dir/bin/ffprobe"
          printf '%s\n' "$media_dir/bin" >> "$GITHUB_PATH"
      - name: Install Windows media evidence dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey package pin. No Dependabot ecosystem for Chocolatey;
        # renew quarterly or when the approved package advances. Put the real
        # binaries ahead of Chocolatey's process-spawning shims: the supervised
        # worker intentionally permits only itself plus one ffprobe child.
        run: |
          choco install ffmpeg --version=8.1.2 --no-progress -y
          $ffmpegBin = 'C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin'
          if (-not (Test-Path "$ffmpegBin\ffprobe.exe" -PathType Leaf)) {
            throw "Chocolatey ffprobe binary was not installed at the pinned path"
          }
          $ffmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pip install ".[test]"
      - run: >-
          pytest -v --tb=short
          tests/test_artifact_locator.py
          tests/test_vault_root_authority.py
          tests/test_artifact_supervisor.py
          tests/test_artifact_metadata.py
          tests/test_pdf_evidence.py
          tests/test_video_evidence.py
          tests/test_video_slide_extraction.py
          tests/test_pattern_evidence.py::test_forward_slash_root_is_classified_without_host_reinterpretation
          tests/test_check_runtime.py::test_psutil_version_authorities_are_synchronized
