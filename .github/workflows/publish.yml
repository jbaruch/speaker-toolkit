name: Review & Publish Plugin

# Thin caller for the canonical fleet publish pipeline
# (jbaruch/coding-policy#206). Display name preserved for run-name watchers.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  publish:
    # Pinned to a SHA carrying smart-publish's REGISTRY-aware auto-bump
    # (coding-policy#298). The previous pin computed the next version from the
    # manifest alone, which collides whenever a credit-outage run skips the
    # manifest commit-back and main falls behind the registry — the #324 chore.
    uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@c7d8f6395d89cf206de1570c4d882ff3e2c22dca
    secrets:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    with:
      stamp-changelog: true
      # Repo-side pre-publish gates: the tessl-version-floating carve-out and
      # the package-contents check. Composed because this input takes one path.
      pre-publish-script: scripts/pre-publish-checks.sh
      skill-review-credit-outage: skip
